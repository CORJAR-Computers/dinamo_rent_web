# CI — lint + tests + svelte-check + guardia de contacto.
#
# `npm run check` incluye scripts/check-contact.mjs: falla si un teléfono, un
# enlace wa.me o un default de ubicación de la empresa aparece hardcodeado
# fuera de su fuente de verdad (contact.ts / PICKUP_LOCATIONS).
# `npm run lint` aplica ESLint (TS + Svelte), `npm test` corre Vitest (fail-closed
# de adminAuth, rate-limit de login, vista pública de reservas y cobros de
# garantía) y `npm run build` compila con Vite + adapter-vercel: un error de
# bundling o de rutas que el type-check no detecta tumba el CI, no el deploy.
#
# El job corre en Node 24 y el build lleva `VERCEL=1` a propósito: sin esa
# variable `adapter-auto` cae al adaptador genérico y el paso no validaría nada
# del despliegue real. `@sveltejs/adapter-vercel` rechaza Node fuera de 22/24.
#
# Los tests corren contra un Postgres de servicio, no contra un DATABASE_URL
# inalcanzable: el rate limit vive en la tabla `rate_limit_counters` y, sin base,
# `checkRateLimit` cae al respaldo en memoria y el verde de login no probaría
# nada. tests/rateLimit.shared.test.ts falla si eso ocurre.
# El objetivo es que este check esté marcado como "required" en GitHub para que
# bloquee los merges con errores.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # El nombre debe seguir siendo EXACTAMENTE este: la protección de rama
    # (required status check) lo exige por ese contexto en GitHub.
    name: svelte-check + guardia de contacto
    runs-on: ubuntu-latest
    services:
      # Postgres real para los tests: el contador de rate limit y el login
      # ejercitan la tabla compartida en vez de un respaldo en memoria.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # .env no está versionado: prisma generate valida estas variables aunque
      # no conecte a la base de datos, así que se proveen valores dummy de CI.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24: versión aceptada por @sveltejs/adapter-vercel (Node 26 falla con
      # "Unsupported Node.js version") y línea usada por Vercel para construir.
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (package-lock.json)
        run: npm ci

      - name: Generar cliente de Prisma (tipos para svelte-check)
        run: npx prisma generate

      - name: Aplicar migraciones al Postgres de CI
        run: npx prisma migrate deploy

      - name: ESLint (TS + Svelte)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm run test

      - name: svelte-check + guardia de contacto
        run: npm run check

      # VERCEL=1 fuerza el adaptador real de despliegue; sin ella adapter-auto
      # usa el genérico y solo se comprueba que el bundle no explota.
      - name: Build de producción (Vite + adapter-vercel)
        run: npm run build
        env:
          VERCEL: '1'
